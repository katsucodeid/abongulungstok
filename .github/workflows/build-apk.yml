name: Build Abon Gulung Stok Kertas APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/katsucode-release.jks"
          chmod 600 "$RUNNER_TEMP/katsucode-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/katsucode-release.jks" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: gradle -p android --no-daemon :app-aggkrts:assembleDebug
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: gradle -p android --no-daemon :app-aggkrts:assembleRelease
      - name: Verify APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            APK=android/app-aggkrts/build/outputs/apk/debug/app-aggkrts-debug.apk
          else
            APK=android/app-aggkrts/build/outputs/apk/release/app-aggkrts-release.apk
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Verify signing certificate and name APK
        if: github.event_name != 'pull_request'
        run: |
          APK=android/app-aggkrts/build/outputs/apk/release/app-aggkrts-release.apk
          CERT_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERT_OUTPUT"
          echo "$CERT_OUTPUT" | grep -qi "43ecffa454e59b8be2cec3f9c02b451dc9ec2d26dedf150e0a202d07d893d02e"
          cp "$APK" android/app-aggkrts/build/outputs/apk/release/Abon-Gulung-Stok-Kertas-V0.0.1.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aggkrts-v0.0.1
          name: Abon Gulung Stok Kertas V0.0.1
          target_commitish: main
          files: android/app-aggkrts/build/outputs/apk/release/Abon-Gulung-Stok-Kertas-V0.0.1.apk
          make_latest: true
          overwrite_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Abon-Gulung-Stok-Kertas-APK
          path: ${{ github.event_name == 'pull_request' && 'android/app-aggkrts/build/outputs/apk/debug/app-aggkrts-debug.apk' || 'android/app-aggkrts/build/outputs/apk/release/Abon-Gulung-Stok-Kertas-V0.0.1.apk' }}
          if-no-files-found: error
          retention-days: 30
